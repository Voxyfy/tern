name: Tern
options:
  bundleIdPrefix: com.voxyfy
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4U5QVH3U6A
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Filled in by scripts/release.sh from the publisher's Keychain; empty disables Sparkle.
    SPARKLE_PUBLIC_ED_KEY: "nc1m3hKCzQljUfS93/X1AEZ7iGXeml1/lSTgs3LZyiI="
targets:
  Tern:
    type: application
    platform: macOS
    sources:
      - Tern
      # The Go helper built by scripts/build-ternd.sh lands next to the app binary
      # (Contents/MacOS/ternd) so it is signed and notarized with the app.
      - path: ternd/bin/ternd
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: Sparkle
    entitlements:
      path: Tern/Resources/Tern.entitlements
      properties: {}
    info:
      path: Tern/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Batuhan Haymana · PolyForm Noncommercial 1.0.0"
        SUFeedURL: https://voxyfy.github.io/tern/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
  TernTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TernTests
    dependencies:
      - target: Tern
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tern:
    build:
      targets:
        Tern: all
        TernTests: [test]
    test:
      targets:
        - TernTests
